name: veille

on:
  schedule:
    - cron: "*/5 * * * *"   # collecte et alertes immédiates
    - cron: "0 6 * * *"     # résumé quotidien à 07h00 heure de Douala (UTC+1)
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        type: choice
        options: [poll, digest, check]
        default: poll

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Choisir le mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            M="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            M="digest"
          else
            M="poll"
          fi
          echo "m=$M" >> "$GITHUB_OUTPUT"

      - name: Exécuter
        run: python veille.py ${{ steps.mode.outputs.m }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Sauvegarder l'état
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "état veille [skip ci]" && git push)
